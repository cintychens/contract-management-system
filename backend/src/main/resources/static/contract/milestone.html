<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>履约节点管理</title>
</head>
<body>

<h2>履约节点管理</h2>

<table border="1" width="100%" style="text-align:center;">
    <thead>
    <tr>
        <th>节点</th>
        <th>计划时间</th>
        <th>实际时间</th>
        <th>状态</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody id="milestoneList"></tbody>
</table>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const contractId = urlParams.get("id");

    // ⭐ 带token请求（避免401）
    function authFetch(url, options = {}) {
        const token = localStorage.getItem("token") || sessionStorage.getItem("token");

        const headers = new Headers(options.headers || {});
        if (token) {
            headers.set("Authorization", "Bearer " + token);
        }

        return fetch(url, { ...options, headers });
    }

    function loadMilestones() {
        authFetch(`/api/milestones/${contractId}`)
            .then(res => res.json())
            .then(data => render(data));
    }

    // ⭐ 获取当前角色
    function getCurrentUserRole() {
        const userInfo = JSON.parse(localStorage.getItem("userInfo") || sessionStorage.getItem("userInfo"));
        return userInfo?.roleCode || userInfo?.role || '';
    }

    // ⭐ 时间格式优化
    function formatDateTime(dt) {
        if (!dt) return '';
        const d = new Date(dt);
        return d.toLocaleString();
    }

    function render(list) {
        let html = "";

        const role = getCurrentUserRole();

        list.forEach((m, index) => {

            let prev = list[index - 1];

            // ⭐ 权限 + 顺序控制
            let canOperate =
                m.status !== 'COMPLETED' &&
                (role === m.responsibleRole || role === 'ADMIN') &&
                (!prev || prev.status === 'COMPLETED');

            html += `
            <tr>
                <td>${m.name}</td>
                <td>${formatDateTime(m.dueDate)}</td>
                <td>${formatDateTime(m.actualDate)}</td>
                <td>${m.status}</td>
                <td>
                    ${
                        m.status === 'COMPLETED'
                            ? '✔'
                            : `<button
                                    ${!canOperate ? 'disabled style="opacity:0.5;cursor:not-allowed;" title="无权限或未到该节点"' : ''}
                                    onclick="complete(${m.id}, this)"
                               >
                                    完成
                               </button>`
                    }
                </td>
            </tr>`;
        });

        document.getElementById("milestoneList").innerHTML = html;
    }

    function complete(id, btn) {

        // ⭐ 防止非法点击
        if (btn.disabled) {
            alert("当前无权限操作");
            return;
        }

        authFetch(`/api/milestones/${id}/complete`, {
            method: "POST"
        }).then(() => loadMilestones());
    }

    loadMilestones();
</script>

</body>
</html>

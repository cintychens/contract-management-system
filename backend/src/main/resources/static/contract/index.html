<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合同管理 · 智能物流合同管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f9ff;
            min-height: 100vh;
            color: #1e293b;
        }

        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #0b2b4a 0%, #123b5e 100%);
            color: white;
            padding: 30px 0;
            box-shadow: 4px 0 20px rgba(0, 30, 60, 0.15);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .sidebar-header {
            padding: 0 24px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #7ab7ff;
            backdrop-filter: blur(4px);
        }

        .logo-text h2 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .logo-text p {
            font-size: 12px;
            opacity: 0.7;
            letter-spacing: 0.5px;
        }

        .nav-menu {
            padding: 0 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            border-radius: 16px;
            color: rgba(255, 255, 255, 0.75);
            transition: all 0.25s;
            margin-bottom: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .nav-item i {

            font-size: 18px;
        }

        .nav-item:hover {

        }

        .main-content {

        }

        .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #e3ecf5;

    border-radius: 50%;

    margin: 0 auto;
}

@keyframes spin {
    to {
        transform: rotate(360deg);

}

.modal.active {

}

.modal-content {

.modal-header {

    margin-bottom: 20px;

.modal-header h3 {

.close-modal {

.form-group {

.form-group input,

    font-size: 14px;
    color: #1e293b;
}

.form-group textarea {

}

.generate-fields-container {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px 18px;
    margin-top: 10px;
    margin-bottom: 18px;
    max-height: 320px;
    overflow-y: auto;
    padding-right: 6px;
}

.sticky-actions {
    position: sticky;
    bottom: 0;
    background: #ffffff;
    padding-top: 14px;
    margin-top: 16px;
    border-top: 1px solid #eef2f6;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 18px;
    flex-wrap: wrap;
}

        @media (max-width: 1024px) {

            }

            }

            .toolbar {

                align-items: stretch;
            }

            .search-box input {
                width: 160px;
            }
        }
    </style>
</head>

<script>
    const state = {
        page: 1,
        size: 10,
        keyword: '',
        status: '',
        totalPages: 1
    };

    function authFetch(url, options = {}) {
        const token = sessionStorage.getItem('token') || localStorage.getItem('token');
        const headers = new Headers(options.headers || {});
        if (token) headers.set('Authorization', 'Bearer ' + token);
        return fetch(url, { ...options, headers });
    }

    function showModal(modalId) {
        const modal = document.getElementById(modalId);
        if (modal) modal.classList.add('active');
    }

    function toCamel(str) {
    return str.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
}

    function replaceVars(template, data) {
        return template.replace(/\$\{(\w+)}/g, (_, key) => {
            return data[key] || `【${key}】`;  // ⭐ 不再变空
        });
    }

    function closeModal(modalId) {
        const modal = document.getElementById(modalId);
        if (modal) modal.classList.remove('active');
    }

    function escapeHtml(str) {
        return String(str ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function formatDateTime(value) {
        if (!value) return '-';
        try {
            return value.replace('T', ' ').slice(0, 19);
        } catch {
            return value;
        }
    }

    function getStatusText(status) {
        const map = {
            DRAFT: '草稿',
            ACTIVE: '进行中',
            COMPLETED: '已完成',
            EXPIRED: '已到期',
            TERMINATED: '已终止',
            UPLOADED: '已上传'
        };
        return map[status] || status || '-';
    }

    function getStatusClass(status) {
        switch (status) {
            case 'ACTIVE':
            case 'COMPLETED':
                return 'status-active';
            case 'DRAFT':
            case 'UPLOADED':
                return 'status-pending';
            case 'EXPIRED':
            case 'TERMINATED':
                return 'status-expired';
            default:
                return 'status-pending';
        }
    }

    function getContractTypeText(type) {
    const map = {
        transport: '运输合同',
        warehouse: '仓储合同',
        supply: '供应链协议',
        distribution: '配送服务合同',
        outsourcing: '物流外包合同'
    };
    return map[type] || type || '-';
}

    function getVariableLabel(key) {
    return key; // 不再强行翻译
}

    function extractFieldLabels(template) {
    const map = {};

    // ⭐⭐⭐ 更宽松版本（核心改动）
    const regex = /(?:\d+\.\s*)?([^:\n：]{2,})[：:]\s*\$\{(\w+)\}/g;

    let match;
    while ((match = regex.exec(template)) !== null) {
        let label = match[1].trim();
        const key = match[2].trim();

        map[key] = label;
    }

    return map;
}

    function smartTranslate(key) {

    // ⭐⭐⭐ 1. 精确匹配（最高优先级）
    const fullDict = {
        "party_a": "甲方",
        "party_b": "乙方",
        "goods_name": "货物名称",
        "sign_日期": "签署日期",
        "金额_upper": "金额（大写）"
    };

    if (fullDict[key]) {
        return fullDict[key];
    }

    // ⭐ 2. 统一格式
    let result = key.replace(/_/g, ' ');
    result = result.replace(/([A-Z])/g, ' $1');
    result = result.toLowerCase();

    // ⭐ 3. 单词翻译
    const dict = {
        // 基础
        party: '方',
        goods: '货物',
        name: '名称',
        quantity: '数量',

        // 物流
        cargo: '货物',
        weight: '重量',
        package: '包装',
        type: '类型',
        transport: '运输',
        mode: '方式',

        // 时间/金额
        delivery: '发货',
        arrival: '到达',
        amount: '金额',
        upper: '大写',
        date: '日期',
        sign: '签署',

        // 地点
        origin: '起运地',
        destination: '目的地'
    };

    Object.keys(dict).forEach(k => {
        result = result.replace(new RegExp(k, 'g'), dict[k]);
    });

    // ⭐⭐⭐ 4. 组合优化（必须放这里）
    result = result
        .replace('方 a', '甲方')
        .replace('方 b', '乙方')
        .replace('发货 日期', '发货日期')
        .replace('到达 日期', '到达日期')
        .replace('签署 日期', '签署日期')
        .replace('金额 大写', '金额')
        .replace('金额 upper', '金额')
        .replace('货物 重量', '货物重量')
        .replace('包装 类型', '包装类型')
        .replace('运输 方式', '运输方式');

    return result.trim();
}

    async function loadContracts() {
        const tbody = document.getElementById('contractTableBody');
        const emptyHint = document.getElementById('contractEmptyHint');
        const pageInfo = document.getElementById('pageInfo');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        tbody.innerHTML = `<tr><td colspan="7" style="padding:18px; color:#6b7b8f;">加载中...</td></tr>`;
        emptyHint.style.display = 'none';

        try {
            const qs = new URLSearchParams({
                page: String(state.page),
                size: String(state.size),
                keyword: state.keyword || '',
                status: state.status || ''
            });

            const resp = await authFetch(`/api/contracts?${qs.toString()}`);
            if (!resp.ok) throw new Error('获取合同列表失败');

            const result = await resp.json();
            if (result.code !== 200) throw new Error(result.message || '获取合同列表失败');

            const data = result.data || {};
            const records = data.records || [];
            const total = data.total ?? 0;
            const page = data.page ?? state.page;
            const size = data.size ?? state.size;
            const totalPages = data.totalPages ?? Math.ceil(total / size);
            state.totalPages = totalPages || 1;

            pageInfo.textContent = `第 ${page} / ${totalPages || 1} 页 · 共 ${total} 条`;
            prevBtn.disabled = page <= 1;
            nextBtn.disabled = totalPages ? page >= totalPages : records.length < size;

            if (!records.length) {
                tbody.innerHTML = '';
                emptyHint.style.display = 'block';
                return;
            }

            tbody.innerHTML = records.map(contract => `
                <tr>
                    <td>${contract.contractId ?? '-'}</td>
                    <td>${escapeHtml(contract.contractNo || '-')}</td>
                    <td>${escapeHtml(contract.title || '-')}</td>
                    <td>${escapeHtml(contract.contractTypeName || getContractTypeText(contract.contractType))}</td>
                    <td>
                        <span class="status-badge ${getStatusClass(contract.status)}">
                            ${escapeHtml(getStatusText(contract.status))}
                        </span>
                    </td>
                    <td>${formatDateTime(contract.createdAt)}</td>
                    <td>
                        <button class="action-btn" title="查看详情" onclick="viewContract(${contract.contractId})">
                            <i class="fas fa-eye"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        } catch (e) {
            console.error(e);
            tbody.innerHTML = `<tr><td colspan="7" style="padding:18px; color:#dc3545;">加载失败：${escapeHtml(e.message || e)}</td></tr>`;
        }
    }

    async function loadGenerateVariables(templateId) {
    const box = document.getElementById('generateFieldsContainer');

    if (!templateId) {
        box.innerHTML = '';
        return;
    }

    // ⭐ 需要用 textarea 的字段（按需保留/扩展）
    const textareaFields = new Set([
        'serviceScope',
        'serviceStandard',
        'feeStructure',
        'exceptionHandling',
        'breachLiability',
        'extraRequirements',
        'serviceContent',
        'specialRequirement'
    ]);

    try {
        // ⭐ 从后端获取字段（已包含中文 fieldName）
        const resp = await authFetch(`/api/templates/${templateId}/fields`);
        if (!resp.ok) throw new Error(await resp.text());

        const result = await resp.json();
        // 兼容 {data: [...]} 或直接 [...]
        const vars = Array.isArray(result) ? result : (result.data || []);

        if (!vars.length) {
            box.innerHTML = '<div style="color:#6b7b8f;">模板中没有变量字段</div>';
            return;
        }

        box.innerHTML = vars.map(v => {
            const rawKey = v.fieldKey || '';
            // 统一 key：snake_case → camelCase（可选）
            const key = rawKey.replace(/_([a-z])/g, (_, c) => c.toUpperCase());

            // ⭐⭐⭐ 核心：直接用后端返回的中文
            const label = escapeHtml(v.fieldName || key);

            if (textareaFields.has(key)) {
                return `
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>${label}</label>
                        <textarea class="generate-field" data-key="${key}" rows="4"></textarea>
                    </div>
                `;
            }

            return `
                <div class="form-group">
                    <label>${label}</label>
                    <input class="generate-field" data-key="${key}" type="text">
                </div>
            `;
        }).join('');

    } catch (e) {
        console.error(e);
        box.innerHTML = `<div style="color:#dc3545;">字段加载失败：${escapeHtml(e.message || e)}</div>`;
    }
}

    function getFilledContract() {
    const box = document.getElementById("optimizedContract");
    if (!box) return "";

    const clone = box.cloneNode(true);

    // 替换 input 为值
    clone.querySelectorAll("input.contract-input").forEach(input => {
        const value = input.value.trim() || "【未填写】";
        input.replaceWith(document.createTextNode(value));
    });

    return clone.innerHTML
        .replace(/<br\s*\/?>/gi, "\n")   // 保留换行
        .replace(/<\/div>/gi, "\n")
        .replace(/<[^>]+>/g, "")        // 去HTML
        .replace(/\n{2,}/g, "\n")       // 去多余空行
        .trim();
}

    function renderEditableContract(text) {

    if (!text) return "";

    // ⭐ 1. 统一换行
    text = text.replace(/\r\n/g, "\n");

    // ⭐ 2. 修复“合同名称 + 合同类型”粘在一行
    text = text.replace(/^(.+?)(物流运输合同|仓储服务合同|运输合同)/, "$1\n$2");

    // ⭐ 3. 标题后换行
    text = text.replace(/(合同)/, "$1\n");

    // ⭐ 4. 甲乙方换行
    text = text
        .replace(/(甲方.*?)(乙方)/, "$1\n$2")
        .replace(/(乙方.*?)(根据)/, "$1\n$2");

    // ⭐ 5. 条款结构换行
    text = text
        .replace(/([一二三四五六七八九十]+、)/g, "\n$1")
        .replace(/(\d+\.)/g, "\n$1");

    // ⭐⭐ 工具函数：snake_case → camelCase
    function toCamel(str) {
        return str.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
    }

    // ⭐ 6. 先处理变量（避免 <br> 破坏 input）
    // ${xxx}
    text = text.replace(/\$\{(.*?)\}/g, (match, key) => {
        return `<input class="contract-input" data-key="${key}" placeholder="${key}" style="border:1px solid #f97316;border-radius:4px;padding:2px 6px;width:120px;background:#fff7ed;" />`;
    });

    // ⭐ 新增：{{xxx}} 支持
    text = text.replace(/\{\{(.*?)\}\}/g, (match, key) => {

        const camelKey = toCamel(key); // contact_person → contactPerson

        return `<input class="contract-input" data-key="${camelKey}" placeholder="${camelKey}" style="border:1px solid #f97316;border-radius:4px;padding:2px 6px;width:120px;background:#fff7ed;" />`;
    });

    // ⭐ 7. 【待确认】 → 输入框
    text = text.replace(/【待确认】/g, () => {
        return `<input class="contract-input" placeholder="请填写" style="border:1px solid #f97316;border-radius:4px;padding:2px 6px;width:120px;background:#fff7ed;" />`;
    });

    // ⭐ 8. 最后再换行（必须最后做）
    text = text.replace(/\n/g, "<br>");

    return text;
}

    document.addEventListener('DOMContentLoaded', function () {
    loadUserInfo();
    loadContracts();

    const keywordInput = document.getElementById('keywordInput');
    const statusFilter = document.getElementById('statusFilter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let timer = null;
    keywordInput.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
            state.keyword = keywordInput.value.trim();
            state.page = 1;
            loadContracts();
        }, 350);
    });

    statusFilter.addEventListener('change', () => {
        state.status = statusFilter.value;
        state.page = 1;
        loadContracts();
    });

    prevBtn.onclick = () => {
        if (state.page > 1) {
            state.page--;
            loadContracts();
        }
    };

    nextBtn.onclick = () => {
    if (state.page < state.totalPages) {
        state.page++;
        loadContracts();
        }
    };

        if (event.target.classList.contains('modal')) {
            event.target.classList.remove('active');
        }
    };


    // ⭐⭐⭐⭐ 在这里加（核心！！）
    const params = new URLSearchParams(window.location.search);
    if (params.get('openSmart') === 'true') {

        setTimeout(() => {
            if (typeof openGenerateContractModal === 'function') {
                openGenerateContractModal();
            } else {

    function normalizeText(text) {
    return String(text || "")
        .replace(/\r/g, "")
        .replace(/\n{2,}/g, "\n")
        .replace(/([。；])(?=[^\n])/g, "$1\n")
        .trim();
}

    function stripHtml(html) {
    const div = document.createElement("div");
    div.innerHTML = html;
    return div.innerText;
}

async function saveGeneratedContract() {
    try {
        const templateSelect = document.getElementById('generateTemplateSelect');
        const templateId = templateSelect.value;
        const selectedOption = templateSelect.options[templateSelect.selectedIndex];

        const title = document.getElementById('generateContractTitle').value.trim();
        const content = getFilledContract();
        const contractType = selectedOption?.dataset.contractType || '';

        if (!templateId) return alert('请选择模板');
        if (!title) return alert('请输入标题');
        if (!content) return alert('请先生成草稿');
        if (!contractType) return alert('未获取到合同类型');

        const payload = {
            templateId: Number(templateId),
            title,
            contractType,
            draftContent: content
        };

        document.querySelectorAll('.generate-field').forEach(input => {
            let key = input.dataset.key;
            key = key.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
            payload[key] = input.value.trim();
        });

        const resp = await authFetch('/api/contracts/confirm-generated', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const result = await resp.json();

        if (!resp.ok || (result.code && result.code !== 200)) {
            throw new Error(result.message || '保存失败');
        }

        alert('保存成功');
        closeModal('generateContractModal');
        loadContracts();

    } catch (e) {
        console.error(e);
        alert('保存失败：' + (e.message || e));
    }
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>合同详情 · 智能物流合同管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f9ff;
            min-height: 100vh;
            color: #1e293b;
        }

        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }

        /* 侧边栏 */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #0b2b4a 0%, #123b5e 100%);
            color: white;
            padding: 30px 0;
            box-shadow: 4px 0 20px rgba(0, 30, 60, 0.15);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .sidebar-header {
            padding: 0 24px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #7ab7ff;
            backdrop-filter: blur(4px);
        }

        .logo-text h2 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .logo-text p {
            font-size: 12px;
            opacity: 0.7;
            letter-spacing: 0.5px;
        }

        .nav-menu {
            padding: 0 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            border-radius: 16px;
            color: rgba(255, 255, 255, 0.75);
            transition: all 0.25s;
            margin-bottom: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .nav-item i {
            width: 22px;
            font-size: 18px;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            transform: translateX(5px);
        }

        .nav-item.active {
            background: linear-gradient(95deg, #2d6da0, #1a4b75);
            color: white;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .nav-item.active i {
            color: #ffd966;
        }

        .nav-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 20px 0;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 30px 35px;
            background: #f5f9ff;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 15px 25px;
            border-radius: 24px;
            box-shadow: 0 4px 12px rgba(0, 30, 60, 0.05);
            border: 1px solid rgba(45, 109, 160, 0.1);
        }

        .page-title h1 {
            font-size: 24px;
            color: #1a4b75;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 12px 6px 6px;
            border-radius: 40px;
            background: #f0f7ff;
            cursor: pointer;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(145deg, #2d6da0, #1a4b75);
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
        }

        .user-details {
            line-height: 1.4;
        }

        .user-name {
            font-weight: 700;
            color: #1a4b75;
        }

        .user-role {
            font-size: 12px;
            color: #5f7d9c;
        }

        /* 卡片 */
        .content-card {
            background: white;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 8px 20px rgba(45, 109, 160, 0.05);
            border: 1px solid rgba(45, 109, 160, 0.1);
            margin-bottom: 24px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn.primary {
            background: linear-gradient(135deg, #2d6da0, #1a4b75);
            color: white;
        }

        .action-btn.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(45, 109, 160, 0.25);
        }

        .action-btn.danger {
            background: #eef5fb;
            color: #1a4b75;
            border: 1px solid #d7e4f2;
        }

        .action-btn.secondary {
            background: #f5f7fa;
            color: #1a4b75;
            border: 1px solid #d7e4f2;
        }

        .section-title {
            font-size: 20px;
            color: #1a4b75;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .info-item {
            background: #f8fbff;
            border: 1px solid #e3ecf5;
            border-radius: 18px;
            padding: 16px;
        }

        .info-item .label {
            font-size: 13px;
            color: #6b7b8f;
            margin-bottom: 8px;
        }

        .info-item .value {
            color: #1a4b75;
            font-weight: 600;
            word-break: break-word;
        }

        .content-box {
            background: #f8fbff;
            border: 1px solid #e3ecf5;
            border-radius: 18px;
            padding: 18px;
            min-height: 180px;
            white-space: pre-wrap;
            line-height: 1.8;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
        }

        .status-active { background: #e3f7ec; color: #10b981; }
        .status-pending { background: #fff4e0; color: #f59e0b; }
        .status-expired { background: #fee9e9; color: #dc3545; }

        /* 流转条 */
        .flow-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .flow-step {
            padding: 10px 18px;
            border-radius: 24px;
            background: #e6edf5;
            color: #5b6b7c;
            font-weight: 700;
            min-width: 92px;
            text-align: center;
        }
        .flow-step.done { background: #4da3ff; color: #fff; }
        .flow-step.active { background: #1a4b75; color: #fff; }
        .flow-arrow { color: #9aa8b6; font-weight: 700; font-size: 18px; }

        /* Tabs */
        .detail-tabs {
            display: flex;
            gap: 16px;
            background: #f0f6fc;
            border-radius: 32px;
            padding: 6px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .detail-tab {
            padding: 12px 26px;
            border-radius: 28px;
            background: #eef5fb;
            color: #1a4b75;
            border: 1px solid #d7e4f2;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .detail-tab.active {
            background: linear-gradient(135deg, #2d6da0, #1a4b75);
            color: white;
            box-shadow: 0 12px 24px rgba(45, 109, 160, 0.25);
        }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* 时间轴 */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 10px;
        }
        .timeline-item {
            display: flex;
            gap: 16px;
            position: relative;
        }
        .timeline-item:not(:last-child)::after {
            content: "";
            position: absolute;
            left: 11px;
            top: 30px;
            width: 2px;
            height: calc(100% + 10px);
            background: #dbe6f1;
        }
        .timeline-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #c8d8ea;
            flex-shrink: 0;
            z-index: 2;
            margin-top: 4px;
        }
        .timeline-item.done .timeline-dot { background: #28a745; }
        .timeline-item.active .timeline-dot { background: #1a4b75; }
        .timeline-item.danger .timeline-dot { background: #dc3545; }
        .timeline-item.warning .timeline-dot { background: #f39c12; }
        .timeline-content {
            flex: 1;
            background: #f8fbff;
            border: 1px solid #e3ecf5;
            border-radius: 16px;
            padding: 16px 18px;
        }
        .timeline-title {
            font-size: 16px;
            font-weight: 700;
            color: #1a4b75;
            margin-bottom: 8px;
        }

        /* 预警卡片 */
        .alert-summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 24px;
        }
        .alert-summary-card {
            background: #f8fbff;
            border: 1px solid #e3ecf5;
            border-radius: 18px;
            padding: 20px;
            text-align: center;
        }
        .alert-summary-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .alert-summary-value.warning { color: #f59e0b; }
        .alert-summary-value.danger { color: #dc3545; }
        .alert-summary-value.normal { color: #1a4b75; }
        .alert-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .alert-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            background: #f8fbff;
            border: 1px solid #e3ecf5;
            border-radius: 18px;
            padding: 18px;
            flex-wrap: wrap;
        }
        .alert-item-left {
            display: flex;
            gap: 14px;
            flex: 1;
        }
        .alert-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }
        .alert-item.warning .alert-icon { background: #f59e0b; }
        .alert-item.danger .alert-icon { background: #dc3545; }
        .alert-item.normal .alert-icon { background: #2d6da0; }
        .alert-tag {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .warning-tag { background: #fff4e0; color: #f59e0b; }
        .danger-tag { background: #fee9e9; color: #dc3545; }
        .normal-tag { background: #e8f1fb; color: #2d6da0; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #eef2f6;
        }
        th { color: #4f6f8f; font-weight: 600; }
        textarea, input {
            border-radius: 12px;
            border: 1px solid #dbe6f1;
            padding: 10px;
            font-size: 14px;
        }
        @media (max-width: 1024px) {
            .sidebar { width: 90px; }
            .sidebar .logo-text, .sidebar .nav-item span { display: none; }
            .main-content { margin-left: 90px; }
            .nav-item { justify-content: center; }
        }
        @media (max-width: 768px) {
            .main-content { padding: 20px; }
            .info-grid, .alert-summary-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

</body>
</html>
